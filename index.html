<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sigma Exchange</title><style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#131d2b;--line:#27364a;--text:#edf4ff;--muted:#92a3ba;--green:#52e0a1;--gold:#f3c969;--red:#ff7b85}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17283a,#0b1018 55%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}button,input,select{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px 12px;background:#0d1622;color:var(--text)}button{cursor:pointer}button:hover{border-color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--green);color:#062117;border-color:var(--green);font-weight:800}.hidden{display:none!important}.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0 22px}.brand{font-size:23px;font-weight:900;letter-spacing:.4px}.brand span{color:var(--green)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}.nav,.panel,.card,.auth{background:rgba(19,29,43,.92);border:1px solid var(--line);border-radius:16px}.nav{padding:12px;height:max-content;position:sticky;top:12px}.nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;border-color:transparent}.nav button:hover,.nav button.active{background:#1b2b3e;border-color:var(--line)}.label{font-size:11px;color:var(--muted);letter-spacing:1.4px;font-weight:800;margin:14px 8px 5px}.page{display:none}.page.active{display:block}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card,.panel{padding:17px}.muted{color:var(--muted)}.value{font-size:27px;font-weight:850}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}h1{font-size:28px;margin:0 0 7px}h2{margin:25px 0 12px}h3{margin:0 0 7px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{max-width:100%}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.auth{max-width:460px;margin:8vh auto;padding:24px}.auth input{width:100%;margin:5px 0 12px}.pill{border:1px solid var(--line);border-radius:100px;padding:3px 8px;color:var(--muted);font-size:12px}.cardart{min-height:155px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#233e53,#111a29);border:1px solid #476076;border-radius:13px;padding:14px}.cardart .emoji{font-size:38px}.rarity-Commune{border-color:#526578}.rarity-Rare{border-color:#4d9bdf}.rarity-Épique{border-color:#a17ae8}.rarity-Légendaire{border-color:#edba53}.rarity-Mythique{border-color:#ed6d9a;box-shadow:0 0 20px #e94e7a20}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#101a27;margin:12px 0}.authrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:12px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0 10px}@media(max-width:780px){.layout{grid-template-columns:1fr}.nav{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}.label{grid-column:1/-1}.nav button{font-size:13px}.wrap{padding:12px}.value{font-size:23px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">Σ <span>SIGMA</span> EXCHANGE</div><div class="muted">Bourse virtuelle · Collection de cartes</div></div><div id="userBar" class="row hidden"><span id="userTitle" class="gold"></span><b id="username"></b><span class="pill" id="balance"></span><button onclick="logout()">Déconnexion</button></div></header>
<section id="auth" class="auth"><h1>Bienvenue sur Sigma</h1><p class="muted">Investis, collectionne et construis ton patrimoine virtuel.</p><div id="loginBox"><label>Identifiant</label><input id="loginUser" autocomplete="username" placeholder="Identifiant"><label>Mot de passe</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Mot de passe"><button class="primary" style="width:100%" onclick="login()">Connexion</button><p>Pas de compte ? <button onclick="toggleAuth(true)">Créer un compte</button></p></div><div id="registerBox" class="hidden"><div class="authrow"><div><label>Identifiant</label><input id="regUser"></div><div><label>Mot de passe</label><input id="regPass" type="password"></div><div><label>Prénom</label><input id="regFirst"></div><div><label>Nom</label><input id="regLast"></div><div><label>Email</label><input id="regEmail"></div><div><label>Téléphone</label><input id="regPhone"></div></div><button class="primary" style="width:100%" onclick="register()">Créer mon compte</button><p>Déjà inscrit ? <button onclick="toggleAuth(false)">Connexion</button></p></div><p id="authError" class="red"></p></section>
<div id="app" class="layout hidden"><nav class="nav"><div class="label">TERMINAL</div><button class="active" onclick="show('home',this)">◈ Vue d'ensemble</button><button onclick="show('market',this)">↗ Bourse</button><button onclick="show('portfolio',this)">▤ Portefeuille</button><div class="label">COLLECTION</div><button onclick="show('shop',this)">▣ Boutique de packs</button><button onclick="show('collection',this)">◇ Ma collection</button><button onclick="show('titles',this)">♛ Mes titres</button><div id="adminNav" class="hidden"><div class="label">ADMINISTRATION</div><button onclick="show('admin',this)">⚙ Console admin</button></div></nav><main>
<section id="home" class="page active"></section><section id="market" class="page"></section><section id="portfolio" class="page"></section><section id="shop" class="page"></section><section id="collection" class="page"></section><section id="titles" class="page"></section><section id="admin" class="page"></section></main></div></div>
<script>
const $=id=>document.getElementById(id);let me=null,marketCache=null,collectionCache=null;const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{credentials:'include',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Erreur');return d}const post=(url,data)=>api(url,{method:'POST',body:JSON.stringify(data)});
function toggleAuth(reg){$('loginBox').classList.toggle('hidden',reg);$('registerBox').classList.toggle('hidden',!reg);$('authError').textContent=''}async function login(){try{const d=await post('/api/login',{username:$('loginUser').value,password:$('loginPass').value});start(d.user)}catch(e){$('authError').textContent=e.message}}async function register(){try{const d=await post('/api/register',{username:$('regUser').value,password:$('regPass').value,firstName:$('regFirst').value,lastName:$('regLast').value,email:$('regEmail').value,phone:$('regPhone').value});start(d.user)}catch(e){$('authError').textContent=e.message}}async function logout(){await post('/api/logout',{});location.reload()}
function start(u){me=u;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userBar').classList.remove('hidden');$('username').textContent='@'+me.username;$('userTitle').textContent=me.selectedTitle||'';$('adminNav').classList.toggle('hidden',!me.isAdmin);updateBar();home()}function updateBar(){$('balance').textContent=money(me.balance)}function show(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');({home,market,portfolio,shop,collection,titles,admin})[id]?.()}
async function refreshMe(){const d=await api('/api/me');me=d.user;updateBar();$('userTitle').textContent=me.selectedTitle||''}
async function home(){try{await refreshMe();const [m,c]=await Promise.all([api('/api/market'),api('/api/collection')]);marketCache=m;collectionCache=c;const invested=m.assets.reduce((s,a)=>s+Number(a.price)*Number(a.quantity),0),owned=c.cards.filter(x=>x.quantity>0).length;$('home').innerHTML=`<h1>Vue d'ensemble</h1><p class="muted">Bienvenue ${esc(me.firstName)}. Les cours évoluent automatiquement, et la boutique se réapprovisionne toutes les 5 minutes.</p><div class="stats"><div class="card"><div class="muted">LIQUIDITÉS</div><div class="value">${money(me.balance)}</div></div><div class="card"><div class="muted">ACTIONS DÉTENUES</div><div class="value">${money(invested)}</div><div class="muted small">Valeur actuelle du portefeuille</div></div><div class="card"><div class="muted">COLLECTION</div><div class="value">${owned}/${c.cards.length}</div><div class="muted small">Cartes différentes découvertes</div></div><div class="card"><div class="muted">TITRE ACTUEL</div><div class="value gold">${esc(me.selectedTitle||'Débutant')}</div></div></div><div class="section-head"><h2>Marché en bref</h2><button onclick="show('market')">Ouvrir la bourse →</button></div><div class="grid">${m.assets.slice(0,4).map(a=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(a.symbol)}</b><span class="${a.changePct>=0?'green':'red'}">${a.changePct>=0?'+':''}${Number(a.changePct).toFixed(2)}%</span></div><div class="muted small">${esc(a.name)}</div><div class="value">${money(a.price)}</div></div>`).join('')}</div><div class="notice">⚠️ Économie fictive : aucun argent réel n'est utilisé. Les cours sont simulés.</div>`}catch(e){$('home').innerHTML=`<p class="red">${esc(e.message)}</p>`}}
async function market(){try{marketCache=await api('/api/market');$('market').innerHTML=`<h1>Bourse</h1><p class="muted">Achète des actions fictives et revends-les au cours du marché. Les prix changent chaque minute.</p><div class="table-wrap panel"><table><thead><tr><th>Entreprise</th><th>Cours</th><th>Variation</th><th>Détenues</th><th>Ordre</th></tr></thead><tbody>${marketCache.assets.map(a=>`<tr><td><b>${esc(a.symbol)}</b><br><span class="muted small">${esc(a.name)} · ${esc(a.description)}</span></td><td><b>${money(a.price)}</b></td><td class="${a.changePct>=0?'green':'red'}">${a.changePct>=0?'+':''}${Number(a.changePct).toFixed(2)}%</td><td>${a.quantity}</td><td><div class="row"><input id="qty${a.id}" type="number" min="1" max="100000" value="1" style="width:75px"><button class="primary" onclick="trade(${a.id},'buy')">Acheter</button><button onclick="trade(${a.id},'sell')" ${a.quantity<1?'disabled':''}>Vendre</button></div></td></tr>`).join('')}</tbody></table></div><p class="muted small">Les variations sont simulées et ne représentent pas des données financières réelles.</p>`}catch(e){$('market').innerHTML=`<p class="red">${esc(e.message)}</p>`}}async function trade(id,side){try{const d=await post('/api/market/trade',{assetId:id,quantity:$('qty'+id).value,side});me=d.user;updateBar();alert(d.message);market()}catch(e){alert(e.message)}}
async function portfolio(){try{const d=await api('/api/market');$('portfolio').innerHTML=`<h1>Portefeuille</h1><p class="muted">Positions ouvertes et derniers ordres.</p><div class="panel table-wrap"><table><tr><th>Action</th><th>Quantité</th><th>Cours</th><th>Valeur</th></tr>${d.assets.filter(a=>a.quantity>0).map(a=>`<tr><td>${esc(a.symbol)} — ${esc(a.name)}</td><td>${a.quantity}</td><td>${money(a.price)}</td><td>${money(a.price*a.quantity)}</td></tr>`).join('')||'<tr><td colspan="4">Aucune action détenue pour le moment.</td></tr>'}</table></div><h2>Dernières transactions</h2><div class="panel table-wrap"><table><tr><th>Date</th><th>Action</th><th>Type</th><th>Quantité</th><th>Prix unitaire</th></tr>${d.history.map(t=>`<tr><td>${new Date(t.created_at).toLocaleString('fr-FR')}</td><td>${esc(t.symbol||'—')}</td><td class="${t.side==='buy'?'green':'gold'}">${t.side==='buy'?'Achat':'Vente'}</td><td>${t.quantity}</td><td>${money(t.unitPrice)}</td></tr>`).join('')||'<tr><td colspan="5">Aucune transaction.</td></tr>'}</table></div>`}catch(e){$('portfolio').innerHTML=`<p class="red">${esc(e.message)}</p>`}}
async function shop(){try{collectionCache=await api('/api/collection');const d=collectionCache;const last=await api('/api/collection');$('shop').innerHTML=`<h1>Boutique de packs</h1><p class="muted">Le stock se renouvelle automatiquement toutes les 5 minutes. Le contenu des packs est aléatoire.</p><div class="grid">${d.packs.map(p=>`<div class="card"><div class="cardart"><div class="row" style="justify-content:space-between"><span class="pill">PACK COLLECTOR</span><span>▣ ${p.stock} en stock</span></div><div style="font-size:42px">🎴</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description)}</div></div><div class="section-head"><b class="value">${money(p.price)}</b><button class="primary" ${p.stock<1?'disabled':''} onclick="openPack(${p.id})">${p.stock<1?'Épuisé':'Acheter & ouvrir'}</button></div></div>`).join('')}</div><div id="reveal"></div><div class="notice">Les probabilités sont pondérées par rareté et configurées côté serveur. Les packs ne donnent que des objets virtuels.</div>`}catch(e){$('shop').innerHTML=`<p class="red">${esc(e.message)}</p>`}}async function openPack(id){try{const d=await post('/api/packs/open',{packId:id});me=d.user;updateBar();$('reveal').innerHTML=`<div class="panel"><h2>✨ Cartes obtenues !</h2><div class="grid">${d.cards.map(c=>`<div class="cardart rarity-${esc(c.rarity)}"><div class="emoji">${esc(c.emoji)}</div><div><span class="pill">${esc(c.rarity)}</span><h3>${esc(c.name)}</h3><p class="muted small">${esc(c.description)}</p><b>${money(c.baseValue)}</b></div></div>`).join('')}</div></div>`;shop().then(()=>{$('reveal').innerHTML=`<div class="panel"><h2>✨ Cartes obtenues !</h2><div class="grid">${d.cards.map(c=>`<div class="cardart rarity-${esc(c.rarity)}"><div class="emoji">${esc(c.emoji)}</div><div><span class="pill">${esc(c.rarity)}</span><h3>${esc(c.name)}</h3><p class="muted small">${esc(c.description)}</p><b>${money(c.baseValue)}</b></div></div>`).join('')}</div></div>`})}catch(e){alert(e.message)}}
async function collection(){try{collectionCache=await api('/api/collection');const d=collectionCache;$('collection').innerHTML=`<h1>Ma collection</h1><p class="muted">Chaque carte découverte est conservée dans ton inventaire.</p><div class="grid">${d.cards.map(c=>`<div class="cardart rarity-${esc(c.rarity)}"><div class="row" style="justify-content:space-between"><span class="pill">${esc(c.rarity)}</span><span class="pill">× ${c.quantity}</span></div><div class="emoji">${esc(c.emoji)}</div><div><h3>${esc(c.name)}</h3><p class="muted small">${esc(c.description)}</p><b>${money(c.baseValue)}</b></div></div>`).join('')}</div><h2>Ouvertures récentes</h2><div class="panel table-wrap"><table><tr><th>Date</th><th>Pack</th><th>Carte</th><th>Rareté</th></tr>${d.openings.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('fr-FR')}</td><td>${esc(o.pack_name||'Pack')}</td><td>${esc(o.emoji||'🃏')} ${esc(o.card_name||'Carte')}</td><td>${esc(o.rarity||'—')}</td></tr>`).join('')||'<tr><td colspan="4">Ouvre ton premier pack pour commencer la collection.</td></tr>'}</table></div>`}catch(e){$('collection').innerHTML=`<p class="red">${esc(e.message)}</p>`}}
async function titles(){try{const d=await api('/api/titles');$('titles').innerHTML=`<h1>Mes titres</h1><p class="muted">Les titres historiques sont conservés. Sélectionne celui qui apparaîtra à côté de ton nom.</p><div class="grid">${d.titles.map(t=>`<div class="card"><span class="pill">SIGMA TITLE</span><h3 class="gold">♛ ${esc(t.name)}</h3><button onclick="pickTitle('${esc(t.key)}')">${me.selectedTitleKey===t.key?'Titre sélectionné':'Équiper ce titre'}</button></div>`).join('')||'<p>Aucun titre obtenu pour le moment.</p>'}</div>`}catch(e){$('titles').innerHTML=`<p class="red">${esc(e.message)}</p>`}}async function pickTitle(key){try{const d=await post('/api/profile/title',{titleKey:key});me=d.user;updateBar();$('userTitle').textContent=me.selectedTitle||'';titles()}catch(e){alert(e.message)}}
async function admin(){if(!me?.isAdmin)return;try{const [d,g]=await Promise.all([api('/api/admin/users'),api('/api/admin/game')]);$('admin').innerHTML=`<h1>Console d'administration</h1><p class="muted">Gestion des comptes, du stock des packs et des probabilités de cartes.</p><div class="panel"><div class="section-head"><h2 style="margin:0">Boutique</h2><button class="primary" onclick="restock()">↻ Réapprovisionner maintenant</button></div><div class="table-wrap"><table><tr><th>Pack</th><th>Prix</th><th>Stock</th><th></th></tr>${g.packs.map(p=>`<tr><td>${esc(p.name)}</td><td><input id="pp${p.id}" type="number" min="0" value="${p.price}" style="width:100px"></td><td><input id="ps${p.id}" type="number" min="0" value="${p.stock}" style="width:90px"></td><td><button onclick="savePack(${p.id})">Enregistrer</button></td></tr>`).join('')}</table></div></div><div class="panel" style="margin-top:14px"><h2>Cartes et probabilités</h2><div class="table-wrap"><table><tr><th>Carte</th><th>Rareté</th><th>Valeur</th><th>Poids</th><th></th></tr>${g.cards.map(c=>`<tr><td>${esc(c.emoji)} ${esc(c.name)}</td><td>${esc(c.rarity)}</td><td><input id="cv${c.id}" type="number" min="0" value="${c.base_value}" style="width:100px"></td><td><input id="cw${c.id}" type="number" min="0" value="${c.weight}" style="width:90px"></td><td><button onclick="saveCard(${c.id})">Enregistrer</button></td></tr>`).join('')}</table></div></div><div class="panel" style="margin-top:14px"><h2>Comptes</h2><div class="table-wrap"><table><tr><th>Compte</th><th>Nom</th><th>Email</th><th>Solde virtuel</th><th></th></tr>${d.users.map(u=>`<tr><td>@${esc(u.username)} ${u.isAdmin?'👑':''}</td><td>${esc(u.firstName)} ${esc(u.lastName)}</td><td>${esc(u.email)}</td><td><input id="ub${u.id}" type="number" min="0" value="${u.balance}" style="width:120px"></td><td><button onclick="saveUser(${u.id})">Enregistrer</button></td></tr>`).join('')}</table></div></div>`;window.adminData=d.users}catch(e){$('admin').innerHTML=`<p class="red">${esc(e.message)}</p>`}}async function restock(){try{await post('/api/admin/restock',{});alert('Réapprovisionnement effectué.');admin()}catch(e){alert(e.message)}}async function savePack(id){try{await api('/api/admin/packs/'+id,{method:'PUT',body:JSON.stringify({price:Number($('pp'+id).value),stock:Number($('ps'+id).value)})});alert('Pack mis à jour.')}catch(e){alert(e.message)}}async function saveCard(id){try{await api('/api/admin/cards/'+id,{method:'PUT',body:JSON.stringify({baseValue:Number($('cv'+id).value),weight:Number($('cw'+id).value)})});alert('Carte mise à jour.')}catch(e){alert(e.message)}}async function saveUser(id){const u=window.adminData.find(x=>x.id===id);try{await api('/api/admin/users/'+id,{method:'PUT',body:JSON.stringify({...u,balance:Number($('ub'+id).value)})});alert('Compte mis à jour.')}catch(e){alert(e.message)}}
(async()=>{try{const d=await api('/api/me');start(d.user)}catch{}})();
</script></body></html>
